<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Password Manager{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --dark-gradient: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --warning-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --danger-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background gradient */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px),
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100px 100px, 150px 150px, 200px 200px, 250px 250px, 300px 300px, 180px 180px;
            animation: float 20s ease-in-out infinite;
        }

        /* Floating animation for particles */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(-10px) rotate(-5deg); }
        }

        /* Morphing shapes overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 60% 40%, rgba(17, 153, 142, 0.08) 0%, transparent 50%);
            animation: morphShapes 25s ease-in-out infinite;
        }

        @keyframes morphShapes {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            33% { 
                transform: scale(1.1) rotate(120deg);
                opacity: 0.8;
            }
            66% { 
                transform: scale(0.9) rotate(240deg);
                opacity: 0.6;
            }
        }

        .header-text {
            text-align: center;
            margin: 2rem 0;
            position: relative;
            padding: 0 1rem;
        }

        .header-text h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #f0f8ff, #e6f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
            letter-spacing: clamp(1px, 0.5vw, 3px);
            margin-bottom: 10px;
            animation: fadeInDown 1s ease-out, textGlow 3s ease-in-out infinite alternate;
            position: relative;
        }

        .header-text h1 i {
            color: #667eea;
            filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.5));
            animation: iconPulse 2s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes textGlow {
            0% { text-shadow: 0 4px 20px rgba(255, 255, 255, 0.3); }
            100% { text-shadow: 0 4px 30px rgba(255, 255, 255, 0.5), 0 0 20px rgba(102, 126, 234, 0.3); }
        }

        .header-text::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(60px, 20vw, 100px);
            height: 3px;
            background: linear-gradient(90deg, transparent, #fff, #667eea, #fff, transparent);
            border-radius: 2px;
            animation: slideIn 1s ease-out 0.5s both, underlineGlow 2s ease-in-out infinite;
        }

        @keyframes underlineGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .form-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: clamp(15px, 4vw, 25px);
            padding: clamp(20px, 5vw, 40px);
            margin: 1rem auto;
            max-width: 450px;
            width: 100%;
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            animation: fadeInUp 0.8s ease-out, containerFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 4s infinite;
            pointer-events: none;
        }

        .form-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
            border-radius: clamp(15px, 4vw, 25px);
            pointer-events: none;
            animation: colorShift 8s ease-in-out infinite;
        }

        @keyframes colorShift {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .form-group {
            margin-bottom: clamp(15px, 4vw, 25px);
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: clamp(10px, 3vw, 15px) clamp(15px, 4vw, 20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: clamp(10px, 3vw, 15px);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 0 30px rgba(102, 126, 234, 0.2),
                0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px) scale(1.02);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            padding: clamp(12px, 3vw, 15px) clamp(20px, 5vw, 30px);
            border: none;
            border-radius: clamp(10px, 3vw, 15px);
            font-weight: 600;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1;
            text-align: center;
            display: inline-block;
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
            z-index: -1;
        }

        .btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.3);
        }

        .btn-warning:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(240, 147, 251, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.3);
        }

        .btn-info:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(17, 153, 142, 0.4);
        }

        .btn-block {
            width: 100%;
            margin: clamp(15px, 4vw, 20px) 0;
        }

        .alert-messages {
            list-style: none;
            padding: 0;
            margin-bottom: clamp(20px, 5vw, 30px);
            z-index: 1;
            position: relative;
        }

        .alert {
            padding: clamp(12px, 3vw, 15px) clamp(15px, 4vw, 20px);
            border-radius: clamp(10px, 3vw, 15px);
            margin-bottom: 15px;
            border: none;
            backdrop-filter: blur(15px);
            animation: slideInRight 0.5s ease-out, alertPulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
        }

        @keyframes alertPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        .alert::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: alertShimmer 3s infinite;
        }

        @keyframes alertShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(17, 153, 142, 0.9), rgba(56, 239, 125, 0.9));
            color: white;
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.3);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.9), rgba(245, 87, 108, 0.9));
            color: white;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .alert-warning {
            background: linear-gradient(135deg, rgba(255, 236, 210, 0.9), rgba(252, 182, 159, 0.9));
            color: #333;
            box-shadow: 0 10px 30px rgba(252, 182, 159, 0.3);
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .text-center a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
        }

        .text-center a::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .text-center a:hover {
            color: white;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .text-center a:hover::before {
            width: 100%;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                width: 0;
            }
            to {
                width: clamp(60px, 20vw, 100px);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        /* Flash message animations */
        .flash-message {
            position: relative;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .flash-message.fade-out {
            opacity: 0;
            transform: translateX(100px);
        }

        .close-btn {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: clamp(16px, 4vw, 20px);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        /* Additional magical effects */
        .magical-sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        /* Responsive breakpoints */
        @media (max-width: 576px) {
            .header-text {
                margin: 1rem 0;
            }
            
            .form-container {
                margin: 0.5rem;
                padding: 20px;
                border-radius: 15px;
            }
            
            .container {
                padding: 0 0.5rem;
            }
            
            .btn:hover {
                transform: translateY(-1px) scale(1.01);
            }
            
            .form-control:focus {
                transform: translateY(-1px) scale(1.01);
            }
        }

        @media (min-width: 577px) and (max-width: 768px) {
            .header-text {
                margin: 1.5rem 0;
            }
            
            .form-container {
                margin: 1rem;
                padding: 30px;
                border-radius: 20px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .header-text {
                margin: 2rem 0;
            }
            
            .form-container {
                padding: 35px;
                border-radius: 22px;
            }
        }

        @media (min-width: 1025px) {
            .header-text {
                margin: 2.5rem 0;
            }
            
            .form-container {
                padding: 40px;
                border-radius: 25px;
            }
        }

        /* Touch-friendly improvements for mobile */
        @media (pointer: coarse) {
            .btn {
                min-height: 48px;
                padding: 15px 25px;
            }
            
            .form-control {
                min-height: 48px;
                padding: 15px 20px;
            }
            
            .close-btn {
                width: 44px;
                height: 44px;
            }
        }

        /* High-resolution displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .sparkle {
                width: 3px;
                height: 3px;
            }
        }

        /* Landscape orientation on mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .header-text {
                margin: 1rem 0;
            }
            
            .header-text h1 {
                font-size: 2rem;
            }
            
            .form-container {
                margin: 0.5rem auto;
                padding: 20px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.08);
                --glass-border: rgba(255, 255, 255, 0.15);
            }
        }

        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Magical sparkles -->
    <div class="magical-sparkles" id="sparkles"></div>
    
    <!-- Header Section with Title -->
    <div class="header-text">
        <h1><i class="fas fa-shield-alt"></i> Password Manager</h1>
    </div>

    <!-- Content from child templates -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Include Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
    <script>
        // Create magical sparkles with device-appropriate count
        function createSparkles() {
            const sparkleContainer = document.getElementById('sparkles');
            const isMobile = window.innerWidth <= 768;
            const sparkleCount = isMobile ? 8 : 15; // Fewer sparkles on mobile for performance
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                sparkleContainer.appendChild(sparkle);
            }
        }
        
        // Responsive sparkles management
        function manageSparkles() {
            const sparkleContainer = document.getElementById('sparkles');
            const isMobile = window.innerWidth <= 768;
            
            // Clear existing sparkles
            sparkleContainer.innerHTML = '';
            
            // Create appropriate number of sparkles
            createSparkles();
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            createSparkles();
            
            // Add smooth scrolling
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth'
                        });
                    }
                });
            });
            
            // Add enhanced hover effects for desktop
            if (window.innerWidth > 768) {
                document.querySelectorAll('.form-control').forEach(input => {
                    input.addEventListener('focus', function() {
                        this.parentElement.style.transform = 'translateY(-2px)';
                    });
                    
                    input.addEventListener('blur', function() {
                        this.parentElement.style.transform = 'translateY(0)';
                    });
                });
            }
            
            // Touch-friendly interactions for mobile
            if ('ontouchstart' in window) {
                document.querySelectorAll('.btn').forEach(button => {
                    button.addEventListener('touchstart', function() {
                        this.style.transform = 'scale(0.98)';
                    });
                    
                    button.addEventListener('touchend', function() {
                        this.style.transform = '';
                    });
                });
